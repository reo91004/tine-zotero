[project]
name = "tine-zotero"
version = "0.1.0"
description = "Two-way sync of PDF highlights between Zotero and the Tine note app"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24"]

[project.urls]
Homepage = "https://github.com/reo91004/tine-zotero"

[project.scripts]
tzb = "tzb.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tzb"]
